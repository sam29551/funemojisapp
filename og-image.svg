<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#ec4899" opacity="0.2" filter="url(#glow)" />

  <!-- Central Card -->
  <rect x="80" y="70" width="1040" height="490" rx="32" fill="url(#cardBg)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Logo Icon -->
  <rect x="140" y="130" width="80" height="80" rx="20" fill="url(#brandGrad)" />
  <text x="180" y="185" font-family="'Segoe UI Emoji', Arial, sans-serif" font-size="44" text-anchor="middle" fill="#ffffff">✨</text>

  <!-- Brand Name -->
  <text x="245" y="175" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1">FunEmojis<tspan fill="url(#brandGrad)">.app</tspan></text>
  <text x="248" y="202" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="2">THE ULTIMATE EMOJI KEYBOARD &amp; DIRECTORY</text>

  <!-- Big Hero Punchline -->
  <text x="140" y="300" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Copy &amp; Paste <tspan fill="url(#brandGrad)">2,000+ Emojis</tspan>
  </text>
  <text x="140" y="360" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#cbd5e1">
    Fancy Fonts, Kaomoji &amp; Aesthetic Combos in 1-Click
  </text>

  <!-- Feature Pills -->
  <g transform="translate(140, 410)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="190" height="50" rx="14" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="1.5" />
    <text x="95" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#e0e7ff" text-anchor="middle">⚡ 1-Click Copy</text>

    <!-- Pill 2 -->
    <rect x="210" y="0" width="220" height="50" rx="14" fill="rgba(236,72,153,0.2)" stroke="#ec4899" stroke-width="1.5" />
    <text x="320" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#fce7f3" text-anchor="middle">📑 Emojis Directory</text>

    <!-- Pill 3 -->
    <rect x="450" y="0" width="210" height="50" rx="14" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1.5" />
    <text x="555" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#d1fae5" text-anchor="middle">𝓕 Fancy Font Styler</text>

    <!-- Pill 4 -->
    <rect x="680" y="0" width="230" height="50" rx="14" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="795" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#fef3c7" text-anchor="middle">(✿◠‿◠) Kaomoji Emoticons</text>
  </g>

  <!-- Bottom Floating Emoji Row -->
  <g transform="translate(140, 510)" font-family="'Segoe UI Emoji', Arial, sans-serif" font-size="34">
    <text x="0" y="0">🔥</text>
    <text x="55" y="0">😀</text>
    <text x="110" y="0">💖</text>
    <text x="165" y="0">🚀</text>
    <text x="220" y="0">🎉</text>
    <text x="275" y="0">👑</text>
    <text x="330" y="0">🍕</text>
    <text x="385" y="0">🐱</text>
    <text x="440" y="0">💯</text>
    <text x="495" y="0">🌈</text>
    <text x="550" y="0">✨</text>
    <text x="605" y="0">🗿</text>
    <text x="660" y="0">🍷</text>
    <text x="715" y="0">💀</text>
    <text x="770" y="0">🎮</text>
    <text x="825" y="0">🌸</text>
    <text x="880" y="0">💎</text>
  </g>

  <!-- URL watermark -->
  <text x="1080" y="180" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#818cf8" text-anchor="end">https://funemojis.app</text>
</svg>
