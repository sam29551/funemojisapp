  <!-- Favicon -->

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">

  <!-- Smart 404 Handler -->
  <script>
    (function routeOldIndexedUrls() {
      try {
        const path = window.location.pathname;
        
        // Handle category or generic old paths
        const catMatch = path.match(/\/(category|cat|tag)\/([^\/\?#]+)/i);
        if (catMatch && catMatch[2]) {
          const catName = decodeURIComponent(catMatch[2]).replace(/[_-]+/g, ' ').trim();
          window.location.replace('/?search=' + encodeURIComponent(catName));
          return;
        }

        // Default redirect to home page after 1.5s
        setTimeout(() => {
          window.location.replace('/');
        }, 1500);
      } catch (e) {
        window.location.replace('/');
      }
    })();
  </script>
</head>
